[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odinbot"
version = "0.1.0"
description = "A Discord bot that checks UUIDs in the ODIN Threatfeed API and can also analyze Discord messages"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.2",  # Discord bot functionality
    "httpx>=0.26.0",     # Async HTTP requests
    "loguru>=0.7.2",     # Logging
    "python-dotenv>=1.0.0",  # Environment variables
    "any-agent[all] @ git+https://github.com/mozilla-ai/any-agent.git",  # Agent functionality with all extras
    "litellm>=1.30.7",   # LLM calls
    "fire>=0.5.0",       # CLI for agent
    "pydantic>=2.6.1",   # Data validation
    "click>=8.1.7",      # CLI framework
    "docker>=7.0.0",     # For MCPStdio tool
    "pytz>=2024.1",      # Timezone handling
]

[project.scripts]
odinbot = "odinbot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odinbot", "odinbot.*"]
exclude = ["logs", "*.log"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0"
]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-pytz>=2024.1.0"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ERA", # eradicate
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
